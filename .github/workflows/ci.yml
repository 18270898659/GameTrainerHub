name: Windows CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & typecheck/build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go static analysis (go vet)
        run: go vet ./...

      - name: Run Go unit and integration tests
        run: go test -v -count=1 ./internal/...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build Wails desktop application
        run: wails build -clean -s

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTrainerHub-win64-ci
          path: build/bin/GameTrainerHub.exe
          retention-days: 7
